[build-system]
requires = ["scikit-build-core>=0.9.0", "pybind11>=2.13.0"]
build-backend = "scikit_build_core.build"

[project]
name = "swiftfs"
version = "0.1.0"
description = "Ultra-fast multi-threaded filesystem scanner, duplicate detector, and disk analyzer powered by C++20."
readme = "README.md"
authors = [
    { name = "SwiftFS Team" }
]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
swiftfs = "python.cli:main"

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"
wheel.expand-macos-universal-tags = true
wheel.packages = ["python"]
